<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="track-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="playhead-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>

    <radialGradient id="glow-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <filter id="blur-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .glow-pulse {
        animation: pulse 6s ease-in-out infinite alternate;
      }
      .playhead-anim {
        animation: scrub 7s ease-in-out infinite;
      }
      .wave-anim {
        animation: waveFloat 4s ease-in-out infinite alternate;
      }
      .clip-flow {
        animation: flowShift 10s linear infinite;
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.96); }
        100% { opacity: 0.8; transform: scale(1.04); }
      }
      @keyframes scrub {
        0% { transform: translateX(0px); }
        50% { transform: translateX(520px); }
        100% { transform: translateX(0px); }
      }
      @keyframes waveFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-4px); }
      }
      @keyframes flowShift {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-40px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Dynamic Glow Orbs (Background layer) -->
  <g class="glow-pulse" style="transform-origin: 300px 150px;">
    <circle cx="280" cy="140" r="220" fill="url(#glow-1)" filter="url(#blur-glow)" />
  </g>
  <g class="glow-pulse" style="transform-origin: 900px 280px; animation-delay: -3s;">
    <circle cx="920" cy="270" r="240" fill="url(#glow-2)" filter="url(#blur-glow)" />
  </g>

  <!-- Geometric Grid Pattern -->
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Outer Frame Border -->
  <rect x="2" y="2" width="1196" height="416" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" rx="14" />

  <!-- Dynamic Timeline Visualization in Background lower area -->
  <g transform="translate(140, 275)" opacity="0.85">
    <!-- Timeline Base Track Container -->
    <rect x="0" y="0" width="920" height="74" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
    
    <!-- Time Ruler Indicators -->
    <line x1="60" y1="0" x2="60" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="160" y1="0" x2="160" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="260" y1="0" x2="260" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="360" y1="0" x2="360" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="460" y1="0" x2="460" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="560" y1="0" x2="560" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="660" y1="0" x2="660" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="760" y1="0" x2="760" y2="10" stroke="#64748b" stroke-width="1" />
    <line x1="860" y1="0" x2="860" y2="10" stroke="#64748b" stroke-width="1" />

    <!-- Video Track Clang Elements -->
    <g class="clip-flow">
      <rect x="20" y="14" width="180" height="24" rx="5" fill="#0284c7" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1" />
      <text x="30" y="30" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">📱 Mobile Footage 4K</text>

      <rect x="210" y="14" width="230" height="24" rx="5" fill="#4f46e5" fill-opacity="0.75" stroke="#818cf8" stroke-width="1" />
      <text x="220" y="30" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Cloud Sync Timeline</text>

      <rect x="450" y="14" width="210" height="24" rx="5" fill="#9333ea" fill-opacity="0.75" stroke="#c084fc" stroke-width="1" />
      <text x="460" y="30" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💻 Desktop NLE Grading</text>

      <rect x="670" y="14" width="220" height="24" rx="5" fill="#0d9488" fill-opacity="0.75" stroke="#2dd4bf" stroke-width="1" />
      <text x="680" y="30" fill="#ccfbf1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🚀 Master Render &amp; Export</text>
    </g>

    <!-- Audio Track with Animated Waveform Wave -->
    <rect x="20" y="44" width="870" height="20" rx="4" fill="#1e293b" />
    <g class="wave-anim" fill="none" stroke="#38bdf8" stroke-width="1.75" stroke-linecap="round" opacity="0.8">
      <path d="M 30 54 Q 60 48, 90 54 T 150 54 T 210 54 T 270 54 T 330 54 T 390 54 T 450 54 T 510 54 T 570 54 T 630 54 T 690 54 T 750 54 T 810 54 T 870 54" />
    </g>

    <!-- Animated Scrubbing Playhead -->
    <g class="playhead-anim" transform="translate(180, 0)">
      <polygon points="0,0 -7,-12 7,-12" fill="url(#playhead-grad)" />
      <line x1="0" y1="0" x2="0" y2="74" stroke="#f43f5e" stroke-width="2.5" />
      <circle cx="0" cy="74" r="3.5" fill="#f43f5e" />
    </g>
  </g>

  <!-- Foreground Main Typography (Guaranteed Unhidden & Clear) -->
  <g id="foreground-content">
    <!-- Category Pill Badge -->
    <g transform="translate(600, 72)">
      <rect x="-170" y="0" width="340" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
      <text x="0" y="21" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">
        🎬 CURATED DIRECTORY &amp; ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="46" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">
      Awesome Cross-Device Video Editing
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#e2e8f0" opacity="0.95">
      Mobile-First Timeline Handoff • Cloud Project Synchronization • Open-Source NLEs
    </text>

    <!-- Device Compatibility Feature Badges -->
    <g transform="translate(600, 235)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
      <rect x="-310" y="0" width="110" height="24" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="-255" y="16" fill="#38bdf8">📱 iOS &amp; Android</text>

      <rect x="-185" y="0" width="115" height="24" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <text x="-128" y="16" fill="#818cf8">💻 macOS &amp; Win</text>

      <rect x="-55" y="0" width="105" height="24" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1" />
      <text x="-3" y="16" fill="#a855f7">🐧 Linux Native</text>

      <rect x="65" y="0" width="115" height="24" rx="12" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
      <text x="122" y="16" fill="#ec4899">☁️ Cloud Project</text>

      <rect x="195" y="0" width="115" height="24" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1" />
      <text x="252" y="16" fill="#10b981">✨ Zero Watermark</text>
    </g>
  </g>
</svg>
